name: Build & release (Windows x64)

# Triggered by a version tag (v1.0.0) or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish a GitHub release'
        type: boolean
        default: false

permissions:
  contents: write

env:
  NODE_VERSION: '20'
  # Electron's postinstall downloads a ~100 MB binary; keep it on the runner.
  ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
  ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

jobs:
  verify:
    name: Typecheck & tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install ffmpeg (render tests need a real encoder)
        run: |
          choco install ffmpeg -y --no-progress
          ffmpeg -version

      - name: Typecheck (main + renderer)
        run: npm run typecheck

      - name: Unit / integration / renderer tests
        run: npm test

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            test-results/**
            coverage/**
          if-no-files-found: ignore

  build:
    name: Package installer + portable
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch ffmpeg + whisper.cpp binaries
        run: node scripts/fetch-binaries.mjs
        env:
          # Optional pin: set the repository variable to lock the ffmpeg build.
          FFMPEG_SHA256: ${{ vars.FFMPEG_SHA256 }}

      - name: Generate icons from the logo
        run: node scripts/make-icons.mjs

      - name: Build renderer, main and preload
        run: npm run build

      - name: Package (NSIS installer + portable exe)
        run: npx electron-builder --win --x64 --publish never
        env:
          # Signing is optional. When the secrets are absent the build is
          # unsigned and the release notes say so.
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      - name: Record what was built
        shell: pwsh
        run: |
          Get-ChildItem release -File | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          $files = Get-ChildItem release -File | Where-Object { $_.Extension -in '.exe','.blockmap','.yml','.zip' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.Name)"
          }
          $lines | Set-Content release/checksums.txt
          Get-Content release/checksums.txt

      - name: Verify packaged app contents
        shell: pwsh
        run: |
          # Sanity-check the asar contains the compiled main process and that the
          # bundled ffmpeg actually runs — a green build that cannot encode is
          # worse than a red one.
          npx asar list release/win-unpacked/resources/app.asar | Select-String 'out\\main\\index.js'
          & 'release/win-unpacked/resources/ffmpeg/ffmpeg.exe' -version | Select-Object -First 1
          & 'release/win-unpacked/resources/ffmpeg/ffprobe.exe' -version | Select-Object -First 1
          if (Test-Path 'release/win-unpacked/resources/app.asar') { Write-Host 'asar present' }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clipwright-windows-x64
          path: |
            release/*.exe
            release/*.blockmap
            release/*.yml
            release/checksums.txt
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace 'refs/tags/','' } else { "v$((Get-Content package.json | ConvertFrom-Json).version)" }
          $signed = if ($env:CSC_LINK) { 'This build is code-signed.' } else { 'This build is UNSIGNED. Windows SmartScreen will warn on first run — verify checksums.txt before installing.' }
          $body = "Native Windows x64 installer and portable build of Clipwright Studio.`n`n$signed`n`nEvery asset is listed in checksums.txt (SHA-256). The app verifies this checksum before running an update.`n`nSee docs/VERIFICATION.md for the test and packaging report."
          $body | Set-Content release/notes.md
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match 'Setup|Portable|checksums\.txt|latest\.yml' } | ForEach-Object { $_.FullName })
          gh release create $tag --title "Clipwright Studio $tag" --notes-file release/notes.md @assets

  verify-artifacts:
    name: Verify release artifacts
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: clipwright-windows-x64
          path: release

      - name: Check hashes and file sizes
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*Setup*.exe' | Select-Object -First 1
          $portable = Get-ChildItem release -Filter '*Portable*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer (.exe) was not produced' }
          if (-not $portable) { throw 'Portable (.exe) was not produced' }
          foreach ($f in @($installer, $portable)) {
            if ($f.Length -lt 50MB) { throw "$($f.Name) is only $([math]::Round($f.Length/1MB,1)) MB — packaging likely failed" }
            Write-Host "$($f.Name): $([math]::Round($f.Length/1MB,1)) MB"
          }
          $expected = Get-Content release/checksums.txt | Where-Object { $_ -match 'Setup|Portable' }
          foreach ($line in $expected) {
            $hash, $name = $line -split '\s+', 2
            $actual = (Get-FileHash (Join-Path release $name.Trim()) -Algorithm SHA256).Hash.ToLower()
            if ($hash -ne $actual) { throw "checksum mismatch for $name" }
            Write-Host "verified $name"
          }
          # A PE that cannot parse would mean a truncated download.
          $bytes = [System.IO.File]::ReadAllBytes($installer.FullName)
          if ($bytes[0] -ne 77 -or $bytes[1] -ne 90) { throw 'installer is not a valid PE executable' }
          Write-Host 'artifacts look valid'
